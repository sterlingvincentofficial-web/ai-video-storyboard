<!doctype html><html><body style="margin:0;background:#9cc8f0">
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene = await (await fetch('scene.json')).json();
const params = new URLSearchParams(location.search);
const W = 1280, H = 800;
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setSize(W,H); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const [sx,sy,sz] = p.size; let geo;

  else if (p.shape === 'Cylinder') { const r=Math.min(sy,sz)/2; geo = new THREE.CylinderGeometry(r,r,sx,32); geo.rotateZ(-Math.PI/2); }
  else geo = new THREE.BoxGeometry(sx,sy,sz);
  const col = new THREE.Color().setRGB(...p.color, THREE.SRGBColorSpace);
  const rough = {SmoothPlastic:0.55, Metal:0.3, Neon:1, Wood:0.9, WoodPlanks:0.9, Grass:1, Ground:1, Sand:1, Slate:0.95, Fabric:1}[p.material] ?? 0.7;
  const mat = new THREE.MeshStandardMaterial({color:col, roughness:rough, metalness:p.material==='Metal'?0.6:0,
    emissive: p.material==='Neon'?col:0x000000, emissiveIntensity: p.material==='Neon'?1.5:0});
  const m = new THREE.Mesh(geo, mat); m.castShadow = p.cast_shadow; m.receiveShadow = true;
  const r = p.rot, q = p.pos;
  m.matrixAutoUpdate = false;
  m.matrix.set(r[0][0],r[0][1],r[0][2],q[0], r[1][0],r[1][1],r[1][2],q[1], r[2][0],r[2][1],r[2][2],q[2], 0,0,0,1);
  s.add(m);
}
const cam = new THREE.PerspectiveCamera(+(params.get('fov')||50), W/H, 0.1, 500);
const [cx,cy,cz,tx,ty,tz] = (params.get('cam')||'0,40,55,0,0,0').split(',').map(Number);

renderer.render(s, cam); window.DONE = true;
</script></body></html>
