<!doctype html><html><body style="margin:0">
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
<script type="module">
// Approximate Roblox look for previewing generated models without Studio:
// Studs surfaces become a tiling stud texture, the R6 Head mesh becomes a rounded cylinder.
import * as THREE from 'three';
import { GLTFLoader } from './node_modules/three/examples/jsm/loaders/GLTFLoader.js';
const scene = await (await fetch('scene.json')).json();
const params = new URLSearchParams(location.search);
const W = 1280, H = 720;
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setSize(W,H); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);
const s = new THREE.Scene();

// sky: blue overhead fading to mint at the horizon
const sky = document.createElement('canvas'); sky.width = 4; sky.height = 256;
const sg = sky.getContext('2d'), grad = sg.createLinearGradient(0,0,0,256);
grad.addColorStop(0,'#2f8fd0'); grad.addColorStop(0.55,'#6cc9c0'); grad.addColorStop(1,'#a6e8c4');
sg.fillStyle = grad; sg.fillRect(0,0,4,256);
s.background = new THREE.CanvasTexture(sky); s.background.colorSpace = THREE.SRGBColorSpace;
s.fog = new THREE.Fog(0x9fe6c8, 160, 320);

s.add(new THREE.HemisphereLight(0xe8fff4, 0x8a7a50, 1.5));
const sun = new THREE.DirectionalLight(0xfff6e0, 2.4); sun.position.set(25,60,35); sun.castShadow = true;
sun.shadow.mapSize.set(4096,4096); Object.assign(sun.shadow.camera,{left:-60,right:60,top:60,bottom:-60,near:1,far:200}); sun.shadow.bias=-0.0004;
s.add(sun);

// one stud per texture tile
const sc = document.createElement('canvas'); sc.width = sc.height = 64;
const g = sc.getContext('2d');
g.fillStyle = '#d8d8d8'; g.fillRect(0,0,64,64);
g.fillStyle = '#c4c4c4'; g.fillRect(0,62,64,2); g.fillRect(62,0,2,64);
const rr = (x,y,w,h,r,c)=>{ g.fillStyle=c; g.beginPath(); g.roundRect(x,y,w,h,r); g.fill(); };
rr(18,18,30,30,7,'#9a9a9a'); rr(15,15,30,30,7,'#ffffff'); rr(17,17,27,27,6,'#e6e6e6');
const studTex = new THREE.CanvasTexture(sc); studTex.colorSpace = THREE.SRGBColorSpace;
studTex.wrapS = studTex.wrapT = THREE.RepeatWrapping; studTex.anisotropy = 8;
const studMap = (u,v) => { const t = studTex.clone(); t.repeat.set(u,v); t.needsUpdate = true; return t; };

// Roblox R6 head mesh (scale 1.25): rounded cylinder ~1.25 tall, ~1.2 wide
const headPts = []; const R = 0.6, Hh = 0.625, rnd = 0.22;
headPts.push(new THREE.Vector2(0,-Hh));
for (let i=0;i<=8;i++){ const a=-Math.PI/2 + i/8*Math.PI/2; headPts.push(new THREE.Vector2(R-rnd+Math.cos(a)*rnd, -Hh+rnd+Math.sin(a)*rnd)); }
for (let i=0;i<=8;i++){ const a=i/8*Math.PI/2; headPts.push(new THREE.Vector2(R-rnd+Math.cos(a)*rnd, Hh-rnd+Math.sin(a)*rnd)); }
headPts.push(new THREE.Vector2(0,Hh));
const headGeo = new THREE.LatheGeometry(headPts, 40);

const rough = {SmoothPlastic:0.5, Plastic:0.75, Metal:0.35, Neon:1};
for (const model of scene) for (const p of model.parts) {
  const [sx,sy,sz] = p.size; let geo, mats;
  const col = new THREE.Color().setRGB(...p.color, THREE.SRGBColorSpace);
  const base = {color:col, roughness:rough[p.material] ?? 0.7, metalness:p.material==='Metal'?0.5:0,
    emissive:p.material==='Neon'?col:0x000000, emissiveIntensity:p.material==='Neon'?1.4:0,
    transparent:p.transparency>0, opacity:1-p.transparency};
  if (p.reflectance) base.roughness = 0.25;
  if (p.mesh && p.mesh.MeshType === 'Head') { geo = headGeo.clone(); geo.scale(...p.mesh.Scale.map(v=>v/1.25)); mats = new THREE.MeshStandardMaterial(base); }
  else if (p.shape === 'Ball') { geo = new THREE.SphereGeometry(sx/2, 24, 16); mats = new THREE.MeshStandardMaterial(base); }
  else if (p.shape === 'Cylinder') { const r=Math.min(sy,sz)/2; geo = new THREE.CylinderGeometry(r,r,sx,28); geo.rotateZ(-Math.PI/2); mats = new THREE.MeshStandardMaterial(base); }
  else {
    geo = new THREE.BoxGeometry(sx,sy,sz);
    if (p.look === 'studs') {
      // BoxGeometry face order: +x, -x, +y, -y, +z, -z
      const faces = [[sz,sy],[sz,sy],[sx,sz],null,[sx,sy],[sx,sy]];
      mats = faces.map(f => new THREE.MeshStandardMaterial(f ? {...base, map:studMap(f[0],f[1])} : base));
    } else mats = new THREE.MeshStandardMaterial(base);
  }
  const m = new THREE.Mesh(geo, mats); m.castShadow = p.name !== 'Water'; m.receiveShadow = true;
  const r = p.rot, q = p.pos;
  m.matrixAutoUpdate = false;
  m.matrix.set(r[0][0],r[0][1],r[0][2],q[0], r[1][0],r[1][1],r[1][2],q[1], r[2][0],r[2][1],r[2][2],q[2], 0,0,0,1);
  s.add(m);
}
// extra imported meshes: ?models=file.glb@x,y,z,yawDeg;...  (glTF is +Y up, model faces +Z after Blender export)
for (const spec of (params.get('models')||'').split(';').filter(Boolean)) {
  const [file, at] = spec.split('@'); const [x,y,z,yaw] = at.split(',').map(Number);
  const gltf = await new GLTFLoader().loadAsync(file);
  gltf.scene.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; } });
  gltf.scene.position.set(x,y,z); gltf.scene.rotation.y = yaw*Math.PI/180; s.add(gltf.scene);
}
const cam = new THREE.PerspectiveCamera(+(params.get('fov')||50), W/H, 0.1, 600);
const [cx,cy,cz,tx,ty,tz] = (params.get('cam')||'0,40,55,0,0,0').split(',').map(Number);
cam.position.set(cx,cy,cz); cam.lookAt(tx,ty,tz);
renderer.render(s, cam); window.DONE = true;
</script></body></html>
