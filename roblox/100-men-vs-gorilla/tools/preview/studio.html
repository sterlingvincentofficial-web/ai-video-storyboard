// ---------------------------------------------------------------- projectiles + camera shake
function shot(obj, from, getTo, dur, arc, spin, onArrive) {

  every(() => { if (!obj.parent) return; const a = Math.min(1, (simT - t0) / dur), to = getTo();
    obj.position.lerpVectors(from, to, a).add(V(0, Math.sin(a * Math.PI) * arc, 0)); obj.rotation.set(simT * spin, simT * spin * 0.7, 0);

let trauma = 0, camBase = null;
function shake(a) { trauma = Math.min(1, trauma + a); }

// ---------------------------------------------------------------- simulation step
function stepOnce() {
  simT += DT;

  while (events.length && events[0].t <= simT) events.shift().fn();
  for (const u of updaters.slice()) u(DT);
  for (let i = flyers.length - 1; i >= 0; i--) {
    const f = flyers[i]; f.life -= DT;
    if (f.life <= 0 || !f.obj.parent) { flyers.splice(i, 1); if (f.onDone && f.obj.parent) f.onDone(f); continue; }
    f.vel.y -= 90 * DT; f.obj.position.addScaledVector(f.vel, DT);
    if (f.spin.length() > 0) f.obj.rotateOnWorldAxis(f.spin.clone().normalize(), f.spin.length() * DT);
    if (f.obj.position.y < f.floor + f.half && f.vel.y < 0) { f.obj.position.y = f.floor + f.half; f.vel.set(f.vel.x * 0.6, -f.vel.y * f.bounce, f.vel.z * 0.6); f.spin.multiplyScalar(0.6); f.bounces++; f.onBounce && f.onBounce(f); }
    if (f.trail) { f.trailT -= DT; if (f.trailT <= 0) { f.trailT = 0.05; poof(f.obj.position.clone(), 1.4, '#e6e6e6'); } }

    if (fx.t >= fx.life) { fxList.splice(i, 1); if (!fx.keep) scene.remove(fx.obj); }

function portraitUnit(unit) {
  newWorld({ noProps: true });
  for (let l = 1; l <= 3; l++) makeMan(unit, l, V((l - 2) * 4.2, 0, 0), (l - 2) * -0.25);
  for (let i = 0; i < 40; i++) stepOnce();
  cam(V(0, 4.6, -15), V(0, 2.9, 0)); render();
}
function portraitMonkey(variant) {
  newWorld({ noProps: true });
  const m = makeMonkey(variant, V(0, 0, 0), V(0.35, 0, -1).normalize());
  for (let i = 0; i < 20; i++) stepOnce();
  const s = ENEMY[variant].scale, h = (ENEMY[variant].boss ? 7 : 6) * s;
  cam(V(-3 * s, h * 0.75, -13 * s), V(0, h * 0.45, 0)); render();
}

  newWorld(); SCENES[name]();

  at(0.45, () => MEN.forEach(m => engage(m, 30)));
  render(); return true;
};
window.advance = n => { for (let i = 0; i < n; i++) stepOnce(); render(); return simT; };
