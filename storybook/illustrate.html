<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<script>
// Hand-coded watercolour / paper cut-out illustrations for the storybook video.
// Every character and background is drawn procedurally here: no image models.
// window.art(name) -> PNG/JPEG data URL.
const TAU = Math.PI * 2;

// ---------- utilities ----------
let SEED = 1;
function rnd() { SEED = (SEED * 16807) % 2147483647; return (SEED - 1) / 2147483646; }
function rr(a, b) { return a + rnd() * (b - a); }
function hex(c) { c = c.replace('#', ''); return [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16)); }
function mix(c, k) { const [r, g, b] = hex(c), f = v => Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k); return [f(r), f(g), f(b)]; }
function col(c, k = 0, a = 1) { const [r, g, b] = mix(c, k); return `rgba(${r},${g},${b},${a})`; }
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const GRAIN = (() => { const c = mk(512, 512), x = c.getContext('2d'), d = x.createImageData(512, 512);
  for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (Math.random() - .5) * 120; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0); return c; })();

// ---------- hand-drawn geometry ----------
// PB samples a path into points so every shape can be wobbled like a hand-cut outline
class PB {
  constructor() { this.p = []; this.c = [0, 0]; }
  M(x, y) { this.c = [x, y]; this.p.push([x, y]); return this; }
  L(x, y) { const [a, b] = this.c, n = Math.max(1, Math.round(Math.hypot(x - a, y - b) / 12)); for (let i = 1; i <= n; i++) this.p.push([a + (x - a) * i / n, b + (y - b) * i / n]); this.c = [x, y]; return this; }
  Q(cx, cy, x, y) { const [a, b] = this.c; for (let i = 1; i <= 16; i++) { const t = i / 16, u = 1 - t; this.p.push([u * u * a + 2 * u * t * cx + t * t * x, u * u * b + 2 * u * t * cy + t * t * y]); } this.c = [x, y]; return this; }
  C(c1x, c1y, c2x, c2y, x, y) { const [a, b] = this.c; for (let i = 1; i <= 22; i++) { const t = i / 22, u = 1 - t; this.p.push([u * u * u * a + 3 * u * u * t * c1x + 3 * u * t * t * c2x + t * t * t * x, u * u * u * b + 3 * u * u * t * c1y + 3 * u * t * t * c2y + t * t * t * y]); } this.c = [x, y]; return this; }
}
function E(cx, cy, rx, ry, n = 64, rot = 0) { const p = [], c = Math.cos(rot), s = Math.sin(rot); for (let i = 0; i < n; i++) { const a = i / n * TAU, x = Math.cos(a) * rx, y = Math.sin(a) * ry; p.push([cx + x * c - y * s, cy + x * s + y * c]); } return p; }
function R(x0, y0, w, h, r) { const b = new PB().M(x0 + r, y0).L(x0 + w - r, y0).Q(x0 + w, y0, x0 + w, y0 + r).L(x0 + w, y0 + h - r).Q(x0 + w, y0 + h, x0 + w - r, y0 + h).L(x0 + r, y0 + h).Q(x0, y0 + h, x0, y0 + h - r).L(x0, y0 + r).Q(x0, y0, x0 + r, y0); return b.p; }
function Pg(pts) { const b = new PB().M(...pts[0]); pts.slice(1).forEach(q => b.L(...q)); b.L(...pts[0]); return b.p; }
function wob(pts, amp) {
  const n = pts.length, ph = [rnd() * 9, rnd() * 9, rnd() * 9];
  return pts.map(([x, y], i) => { const t = i / n * TAU, k = Math.sin(t * 3 + ph[0]) * .5 + Math.sin(t * 7 + ph[1]) * .3 + Math.sin(t * 17 + ph[2]) * .2;
    const a = pts[(i - 1 + n) % n], b = pts[(i + 1) % n]; let nx = -(b[1] - a[1]), ny = b[0] - a[0]; const l = Math.hypot(nx, ny) || 1; return [x + nx / l * k * amp, y + ny / l * k * amp]; });
}
function smooth(pts, closed = true) {
  const p = new Path2D(), n = pts.length, g = i => closed ? pts[(i + n) % n] : pts[Math.max(0, Math.min(n - 1, i))];
  p.moveTo(...pts[0]);
  for (let i = 0; i < (closed ? n : n - 1); i++) { const p0 = g(i - 1), p1 = g(i), p2 = g(i + 1), p3 = g(i + 2);
    p.bezierCurveTo(p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6, p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6, p2[0], p2[1]); }
  if (closed) p.closePath(); return p;
}
function S(pts, amp = 2.5) { const w = wob(pts, amp); let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; w.forEach(([a, b]) => { x0 = Math.min(x0, a); y0 = Math.min(y0, b); x1 = Math.max(x1, a); y1 = Math.max(y1, b); });
  return { path: smooth(w), box: [x0, y0, x1 - x0, y1 - y0] }; }

// ---------- watercolour painting ----------
// base wash, pigment blooms, form shading (light from upper-left), pencil hatching in the shadow side,
// drying edge, paper grain, then a darker-toned wobbly outline
function paint(x, sh, c, { lw = 5, shadow = .38, light = .28, hatch = .5, blooms = 16, edge = .3, line = true, lineK = -.55 } = {}) {
  const [bx, by, bw, bh] = sh.box, M = Math.max(bw, bh);
  x.save(); x.clip(sh.path);
  x.fillStyle = col(c); x.fillRect(bx - 30, by - 30, bw + 60, bh + 60);
  for (let i = 0; i < blooms; i++) { const cx = bx + rnd() * bw, cy = by + rnd() * bh, r = M * rr(.1, .4), k = rnd() < .5 ? -.12 : .16, g = x.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0, col(c, k, .32)); g.addColorStop(1, col(c, k, 0)); x.fillStyle = g; x.fillRect(bx - 30, by - 30, bw + 60, bh + 60); }
  const lg = x.createLinearGradient(bx, by, bx + bw * .9, by + bh);
  lg.addColorStop(0, col(c, .45, light)); lg.addColorStop(.45, col(c, 0, 0)); lg.addColorStop(1, col(c, -.45, shadow));
  x.fillStyle = lg; x.fillRect(bx - 30, by - 30, bw + 60, bh + 60);
  if (hatch > 0) { x.lineWidth = 2; x.lineCap = 'round';
    for (let d = -bh; d < bw + bh; d += 11) { const t = d / (bw + bh); if (t < .5) continue; x.strokeStyle = col(c, -.5, (t - .5) * hatch); x.beginPath(); x.moveTo(bx + d + rr(-2, 2), by); x.lineTo(bx + d - bh + rr(-2, 2), by + bh); x.stroke(); } }
  x.filter = 'blur(6px)'; x.lineWidth = Math.max(8, Math.min(bw, bh) * .07); x.strokeStyle = col(c, -.35, edge); x.stroke(sh.path); x.filter = 'none';
  x.globalAlpha = .14; x.globalCompositeOperation = 'multiply'; x.drawImage(GRAIN, bx, by, Math.max(bw, 512), Math.max(bh, 512));
  x.restore();
  if (line) outline(x, sh.path, lw, col(c, lineK, .95));
}
function outline(x, path, w, c) { x.save(); x.lineJoin = x.lineCap = 'round'; x.strokeStyle = c; x.lineWidth = w; x.stroke(path); x.translate(1.4, 1); x.globalAlpha = .35; x.lineWidth = w * .55; x.stroke(path); x.restore(); }
function pen(x, pts, w = 4, c = 'rgba(59,42,34,.85)') { x.save(); x.lineCap = x.lineJoin = 'round'; x.strokeStyle = c; x.lineWidth = w; x.stroke(smooth(wob(pts, .8), false)); x.restore(); }
function strokes(x, n, f, w, c) { for (let i = 0; i < n; i++) pen(x, f(i), w, c); }
function blush(x, cx, cy, r, a = .5) { const g = x.createRadialGradient(cx, cy, 0, cx, cy, r); g.addColorStop(0, `rgba(232,105,105,${a})`); g.addColorStop(1, 'rgba(232,105,105,0)'); x.fillStyle = g; x.beginPath(); x.arc(cx, cy, r, 0, TAU); x.fill(); }
function dot(x, cx, cy, r, c) { x.fillStyle = c; x.beginPath(); x.arc(cx, cy, r, 0, TAU); x.fill(); }

// ---------- faces ----------
function head(x, cx, cy, r, skin, { ears = true, jaw = .1 } = {}) {
  if (ears) for (const s of [-1, 1]) { const e = S(E(cx + s * r * .96, cy + r * .08, r * .17, r * .22), 1.5); paint(x, e, skin, { lw: r * .03, hatch: .3 }); pen(x, [[cx + s * r * 1.0, cy], [cx + s * r * .95, cy + r * .1], [cx + s * r * .99, cy + r * .16]], r * .02, col(skin, -.45, .7)); }
  const pts = E(cx, cy, r, r * 1.04, 80).map(([a, b]) => b > cy ? [cx + (a - cx) * (1 - jaw * (b - cy) / r), b] : [a, b]);
  paint(x, S(pts, r * .012), skin, { lw: r * .03, shadow: .3, hatch: .25 });
}
function features(x, cx, cy, r, { yawn = 0, closed = false, look = [0, 0], mouth = 'smile', brows = true, browC = '#5a3b2a', liner = false, freckles = false, lashes = false } = {}) {
  blush(x, cx - r * .56, cy + r * .28, r * .24, .45); blush(x, cx + r * .56, cy + r * .28, r * .24, .45);
  if (freckles) for (const s of [-1, 1]) for (let i = 0; i < 5; i++) dot(x, cx + s * r * (.45 + rr(-.1, .12)), cy + r * (.2 + rr(-.05, .1)), r * .012, 'rgba(150,80,50,.55)');
  const ey = cy + r * .02, ex = r * .36, shut = closed || yawn > .5;
  for (const s of [-1, 1]) {
    const X = cx + s * ex;
    if (shut) {
      pen(x, [[X - r * .15, ey - r * .01], [X - r * .07, ey + r * .06], [X + r * .07, ey + r * .06], [X + r * .15, ey - r * .01]], r * .04, 'rgba(45,30,25,.9)');
      for (let k = 0; k < 3; k++) { const t = -.09 + k * .09; pen(x, [[X + r * t, ey + r * .065], [X + r * (t + s * .02 - .01), ey + r * .12]], r * .018, 'rgba(45,30,25,.8)'); }
    } else {
      const w = S(E(X, ey, r * .13, r * .15), .6); x.fillStyle = '#fbf8f2'; x.fill(w.path);
      x.save(); x.clip(w.path);
      const ix = X + look[0] * r * .05, iy = ey + look[1] * r * .05;
      dot(x, ix, iy, r * .1, '#6b4a2e'); dot(x, ix, iy, r * .06, '#1e1512');
      dot(x, ix + r * .03, iy - r * .04, r * .03, '#fff'); dot(x, ix - r * .03, iy + r * .03, r * .014, 'rgba(255,255,255,.8)');
      x.fillStyle = 'rgba(120,80,60,.18)'; x.fillRect(X - r * .15, ey - r * .16, r * .3, r * .06); x.restore();
      outline(x, w.path, r * .022, 'rgba(45,30,25,.85)');
      pen(x, [[X - r * .15, ey - r * .07], [X, ey - r * .16], [X + r * .15, ey - r * .08]], r * .03, 'rgba(45,30,25,.9)');
      if (lashes) pen(x, [[X + s * r * .13, ey - r * .09], [X + s * r * .2, ey - r * .14]], r * .025, 'rgba(45,30,25,.9)');
    }
    if (liner) pen(x, [[X - s * r * .12, ey - r * .02], [X + s * r * .18, ey - r * .03], [X + s * r * .32, ey - r * .11]], r * .045, 'rgba(15,12,10,.95)');
    if (brows) { const lift = yawn * r * .09; pen(x, [[X - r * .16, ey - r * .25 - lift + s * r * .02], [X, ey - r * .31 - lift], [X + r * .16, ey - r * .27 - lift - s * r * .02]], r * .05, col(browC, 0, .85)); }
  }
  // nose
  pen(x, [[cx - r * .02, cy + r * .12], [cx - r * .07, cy + r * .24], [cx, cy + r * .27], [cx + r * .06, cy + r * .25]], r * .028, 'rgba(120,70,50,.65)');
  blush(x, cx + r * .03, cy + r * .2, r * .07, .25);
  const my = cy + r * .5;
  if (yawn > 0) {
    const mw = r * .25, mh = r * .34 * yawn, m = S(E(cx, my + mh * .15, mw, mh), 1);
    const g = x.createRadialGradient(cx, my, 0, cx, my, mh * 1.2); g.addColorStop(0, '#2a0c14'); g.addColorStop(1, '#6a2433');
    x.fillStyle = g; x.fill(m.path);
    x.save(); x.clip(m.path);
    x.fillStyle = '#e8798c'; x.beginPath(); x.ellipse(cx, my + mh * 1.0, mw * .78, mh * .55, 0, 0, TAU); x.fill();
    pen(x, [[cx, my + mh * .65], [cx, my + mh * .95]], r * .015, 'rgba(160,50,70,.6)');
    x.fillStyle = '#fbf7ee'; x.beginPath(); x.ellipse(cx, my + mh * .15 - mh * 1.02, mw * .75, mh * .2, 0, 0, TAU); x.fill();
    x.fillStyle = 'rgba(255,190,200,.6)'; x.beginPath(); x.ellipse(cx, my - mh * .45, mw * .12, mh * .12, 0, 0, TAU); x.fill();
    x.restore(); outline(x, m.path, r * .03, 'rgba(95,35,45,.95)');
  } else if (mouth === 'o') {
    const m = S(E(cx, my, r * .08, r * .1), .6); x.fillStyle = '#5a1f2c'; x.fill(m.path); outline(x, m.path, r * .025, 'rgba(95,35,45,.9)');
  } else if (mouth === 'wavy') {
    pen(x, [[cx - r * .16, my], [cx - r * .08, my - r * .04], [cx, my], [cx + r * .08, my - r * .04], [cx + r * .16, my]], r * .035);
  } else {
    const m = new PB().M(cx - r * .17, my - r * .05).Q(cx, my + r * .1, cx + r * .17, my - r * .05).Q(cx, my + r * .04, cx - r * .17, my - r * .05);
    const sh = S(m.p, .4); x.fillStyle = '#7a2b3a'; x.fill(sh.path); outline(x, sh.path, r * .025, 'rgba(95,35,45,.9)');
    for (const s of [-1, 1]) pen(x, [[cx + s * r * .17, my - r * .09], [cx + s * r * .2, my - r * .03]], r * .02, 'rgba(95,35,45,.7)');
  }
}

// ---------- characters ----------
const SKIN = '#f3c3a0';
function hand(x, cx, cy, r, skin = SKIN, rot = 0) {
  paint(x, S(E(cx, cy, r, r * 1.05, 40, rot)), skin, { lw: 4, hatch: .2 });
  const tx = cx + Math.cos(rot - 1.2) * r * .9, ty = cy + Math.sin(rot - 1.2) * r * .9;
  paint(x, S(E(tx, ty, r * .38, r * .52, 30, rot - 1.2)), skin, { lw: 3.5, hatch: 0 });
}
function kid(x, yawning) {
  const cx = 550, COAT = '#e3a93d';
  // backpack behind
  paint(x, S(R(cx - 158, 560, 316, 270, 60)), '#5e8f4c', { lw: 5 });
  paint(x, S(R(cx - 150, 690, 60, 110, 20)), '#4d7a3e', { lw: 4 });
  // raised arms go behind the coat
  if (yawning) for (const s of [-1, 1]) {
    const arm = new PB().M(cx + s * 95, 620).C(cx + s * 170, 560, cx + s * 190, 380, cx + s * 150, 215).L(cx + s * 100, 225).C(cx + s * 125, 360, cx + s * 110, 520, cx + s * 70, 600);
    paint(x, S(arm.p), COAT, { lw: 5 });
    paint(x, S(R(cx + s * 125 - 38, 200, 76, 40, 16)), '#c98b2a', { lw: 4 });
    hand(x, cx + s * 125, 172, 36, SKIN, s > 0 ? -.2 : .2);
  }
  // legs + boots
  for (const s of [-1, 1]) {
    paint(x, S(R(cx + s * 58 - 30, 870, 60, 100, 12)), '#2d3452', { lw: 4, hatch: .3 });
    const boot = new PB().M(cx + s * 58 - 38, 950).L(cx + s * 58 + 38, 950).L(cx + s * 58 + 42 + s * 22, 1015).Q(cx + s * 58 + s * 30, 1045, cx + s * 58 - s * 10, 1042).L(cx + s * 58 - 44, 1040).Q(cx + s * 58 - 50, 1000, cx + s * 58 - 38, 950);
    paint(x, S(boot.p), '#2e8a82', { lw: 5 });
    pen(x, [[cx + s * 58 - 42, 1022], [cx + s * 58 + 44 + s * 18, 1022]], 5, 'rgba(20,70,66,.8)');
    pen(x, [[cx + s * 58 - 20, 965], [cx + s * 58 - 16, 1000]], 5, 'rgba(255,255,255,.45)');
  }
  // coat
  const coat = new PB().M(cx - 110, 555).Q(cx, 525, cx + 110, 555).C(cx + 140, 640, cx + 170, 780, cx + 185, 895).Q(cx, 935, cx - 185, 895).C(cx - 170, 780, cx - 140, 640, cx - 110, 555);
  paint(x, S(coat.p, 3), COAT, { lw: 6 });
  pen(x, [[cx + 4, 570], [cx - 2, 740], [cx + 3, 915]], 4, 'rgba(140,90,30,.7)');
  for (let i = 0; i < 4; i++) { const t = S(R(cx + 16, 610 + i * 72, 34, 14, 7), .6); paint(x, t, '#7a4a1e', { lw: 2.5, hatch: 0 }); pen(x, [[cx + 4, 617 + i * 72], [cx + 16, 617 + i * 72]], 2.5, 'rgba(80,50,20,.8)'); }
  for (const s of [-1, 1]) { const pk = new PB().M(cx + s * 60, 780).L(cx + s * 135, 780).L(cx + s * 140, 845).L(cx + s * 62, 845).L(cx + s * 60, 780); paint(x, S(pk.p), '#d69a33', { lw: 3.5, hatch: .2 }); pen(x, [[cx + s * 58, 790], [cx + s * 138, 790]], 3, 'rgba(140,90,30,.6)'); }
  strokes(x, 3, i => [[cx - 160 + i * 6, 880 - i * 4], [cx - 100, 860 - i * 30]], 2, 'rgba(140,90,30,.35)');
  // hood collar
  const col_ = new PB().M(cx - 125, 560).Q(cx, 610, cx + 125, 560).Q(cx + 110, 520, cx, 530).Q(cx - 110, 520, cx - 125, 560);
  paint(x, S(col_.p), '#d49630', { lw: 4.5 });
  // straps
  for (const s of [-1, 1]) paint(x, S(Pg([[cx + s * 58, 555], [cx + s * 88, 552], [cx + s * 104, 705], [cx + s * 76, 708]]), 1.2), '#4b7a3c', { lw: 3.5, hatch: .2 });
  // lowered arms in front
  if (!yawning) for (const s of [-1, 1]) {
    const arm = new PB().M(cx + s * 100, 575).C(cx + s * 150, 600, cx + s * 195, 700, cx + s * 205, 800).L(cx + s * 160, 815).C(cx + s * 150, 740, cx + s * 125, 670, cx + s * 100, 640);
    paint(x, S(arm.p), COAT, { lw: 5 });
    paint(x, S(R(cx + s * 183 - 32, 790, 64, 36, 14)), '#c98b2a', { lw: 4 });
    hand(x, cx + s * 186, 848, 34, SKIN, s > 0 ? .4 : -.4);
  }
  // head
  head(x, cx, 425, 150, SKIN);
  // hair tufts under the hat
  for (const s of [-1, 1]) paint(x, S(new PB().M(cx + s * 150, 370).Q(cx + s * 175, 450, cx + s * 130, 470).Q(cx + s * 140, 430, cx + s * 105, 405).L(cx + s * 150, 370).p), '#7a4a2a', { lw: 3.5, hatch: .2 });
  features(x, cx, 440, 140, { yawn: yawning ? 1 : 0, look: [0, -1], freckles: true });
  // beanie
  const hat = new PB().M(cx - 170, 395).C(cx - 185, 200, cx + 185, 200, cx + 170, 395).Q(cx, 405, cx - 170, 395);
  paint(x, S(hat.p, 3), '#d4483a', { lw: 5.5 });
  strokes(x, 9, i => { const t = -.8 + i * .2; return [[cx + t * 120, 250 + Math.abs(t) * 40], [cx + t * 150, 380]]; }, 3, 'rgba(140,35,28,.35)');
  const band = S(R(cx - 178, 350, 356, 68, 30), 2.5); paint(x, band, '#b8382e', { lw: 5 });
  x.save(); x.clip(band.path); for (let i = -9; i <= 9; i++) pen(x, [[cx + i * 20, 352], [cx + i * 20 + 3, 418]], 4, 'rgba(110,25,20,.45)'); x.restore();
  const pom = S(E(cx, 222, 50, 46, 30), 5); paint(x, pom, '#e46a58', { lw: 4.5 });
  strokes(x, 16, () => { const a = rnd() * TAU, d = rr(10, 44); return [[cx + Math.cos(a) * d, 222 + Math.sin(a) * d], [cx + Math.cos(a) * (d + 10), 222 + Math.sin(a) * (d + 10)]]; }, 3, 'rgba(150,40,30,.5)');
}
function shoulders(x, c, cx = 500, top = 735) {
  const sh = new PB().M(cx - 390, 1000).C(cx - 385, 830, cx - 300, top + 10, cx - 150, top).L(cx + 150, top).C(cx + 300, top + 10, cx + 385, 830, cx + 390, 1000).L(cx - 390, 1000);
  paint(x, S(sh.p, 3), c, { lw: 6 });
}
function neck(x, cx, skin) { paint(x, S(R(cx - 72, 620, 144, 150, 40), 1.5), skin, { lw: 4, shadow: .6 }); x.save(); x.globalAlpha = .25; x.fillStyle = col(skin, -.5); x.beginPath(); x.ellipse(cx, 650, 80, 30, 0, 0, TAU); x.fill(); x.restore(); }
function caveman(x) {
  const cx = 500, SK = '#e2ab86', HAIR = '#6a4024';
  // big shaggy hair mass
  const hp = []; for (let i = 0; i < 26; i++) { const a = i / 26 * TAU, r = (i % 2 ? 300 : 262) + rr(-15, 15); hp.push([cx + Math.cos(a) * r * .95, 470 + Math.sin(a) * r]); }
  paint(x, S(hp, 6), HAIR, { lw: 6 });
  strokes(x, 40, () => { const a = rr(Math.PI * .95, Math.PI * 2.05), d = rr(180, 280); return [[cx + Math.cos(a) * d * .95, 470 + Math.sin(a) * d], [cx + Math.cos(a) * (d + 30) * .95, 470 + Math.sin(a) * (d + 30) + 12]]; }, 4, 'rgba(60,32,14,.55)');

function sun(x) {

// ---------- sticker border + crop ----------
function sticker(draw, w = 1100, h = 1100, Rb = 16) {
  const a = mk(w, h), x = a.getContext('2d'); SEED = 7; draw(x);
  const pad = Rb * 2 + 4, b = mk(w + pad * 2, h + pad * 2), y = b.getContext('2d');
  for (let i = 0; i < 28; i++) { const t = i / 28 * TAU; y.drawImage(a, pad + Math.cos(t) * Rb, pad + Math.sin(t) * Rb); }
  y.globalCompositeOperation = 'source-in'; y.fillStyle = '#fbf8f1'; y.fillRect(0, 0, b.width, b.height);
  y.globalCompositeOperation = 'source-atop'; y.globalAlpha = .08; y.drawImage(GRAIN, 0, 0, b.width, b.height);
  y.globalAlpha = 1; y.globalCompositeOperation = 'source-over'; y.drawImage(a, pad, pad);
  const d = y.getImageData(0, 0, b.width, b.height).data; let x0 = b.width, y0 = b.height, x1 = 0, y1 = 0;
  for (let j = 0; j < b.height; j++) for (let i = 0; i < b.width; i++) if (d[(j * b.width + i) * 4 + 3] > 20) { if (i < x0) x0 = i; if (i > x1) x1 = i; if (j < y0) y0 = j; if (j > y1) y1 = j; }
  const c = mk(x1 - x0 + 1, y1 - y0 + 1); c.getContext('2d').drawImage(b, -x0, -y0); return c;
}

// ---------- backgrounds (1960x1104) ----------
const BW = 1960, BH = 1104;
function pencil(x, pts, w, c, a) { x.save(); x.lineCap = x.lineJoin = 'round'; x.strokeStyle = col(c, 0, a); x.lineWidth = w; x.beginPath(); pts.forEach(([p, q], i) => i ? x.lineTo(p, q) : x.moveTo(p, q)); x.stroke(); x.restore(); }
function paperBase(x, c, bl = 40, v = .06) {
  x.fillStyle = col(c); x.fillRect(0, 0, BW, BH);
  for (let i = 0; i < bl; i++) { const cx = rnd() * BW, cy = rnd() * BH, r = rr(150, 520), k = rnd() < .5 ? -v : v, g = x.createRadialGradient(cx, cy, 0, cx, cy, r); g.addColorStop(0, col(c, k, .5)); g.addColorStop(1, col(c, k, 0)); x.fillStyle = g; x.fillRect(0, 0, BW, BH); }
  x.save(); x.globalAlpha = .16; x.globalCompositeOperation = 'multiply'; for (let i = 0; i < 4; i++) for (let j = 0; j < 3; j++) x.drawImage(GRAIN, i * 512, j * 512); x.restore();
  for (let i = 0; i < 260; i++) { const px = rnd() * BW, py = rnd() * BH, a = rnd() * Math.PI; pencil(x, [[px, py], [px + Math.cos(a) * rr(6, 18), py + Math.sin(a) * rr(6, 18)]], 1, '#8a7a60', .18); }
}
function sparkle(x, px, py, s) { pencil(x, [[px - s, py], [px + s, py]], 3, '#6b5e4e', .55); pencil(x, [[px, py - s], [px, py + s]], 3, '#6b5e4e', .55); }
function bgPaper(x) {
  paperBase(x, '#f1e7d2');
  [[140, 120, 18], [1800, 150, 14], [1720, 380, 10], [230, 900, 12], [1850, 960, 16], [980, 70, 9]].forEach(([a, b, s]) => sparkle(x, a, b, s));
  for (let i = 0; i < 5; i++) { const px = rr(100, 1860), py = rr(80, 1020); pencil(x, [[px, py], [px + rr(30, 90), py + rr(-10, 10)]], 1.5, '#8a7a60', .25); }
}
function paperStar(x, cx, cy, r, rot) {
  const p = []; for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5 - Math.PI / 2 + rot, q = i % 2 ? r * .45 : r; p.push([cx + Math.cos(a) * q, cy + Math.sin(a) * q]); }
  const s = S(Pg(p), 1); x.save(); x.lineWidth = 9; x.strokeStyle = '#fbf7ee'; x.stroke(s.path); x.restore(); paint(x, s, '#e8b64a', { lw: 2.5, hatch: 0, blooms: 4 });
}
function bgSky(x) {
  x.fillStyle = '#1b2d5e'; x.fillRect(0, 0, BW, BH);
  for (let i = 0; i < 900; i++) { const px = rnd() * BW, py = rnd() * BH, a = rr(-.6, .6) + (rnd() < .5 ? 0 : Math.PI / 2), l = rr(60, 220), c = ['#223a78', '#16244d', '#2b4a8c', '#132045', '#28427e'][Math.floor(rnd() * 5)];
    x.save(); x.globalAlpha = rr(.15, .45); x.strokeStyle = c; x.lineWidth = rr(14, 40); x.lineCap = 'round'; x.beginPath(); x.moveTo(px, py); x.quadraticCurveTo(px + Math.cos(a) * l * .5 + rr(-20, 20), py + Math.sin(a) * l * .5 + rr(-20, 20), px + Math.cos(a) * l, py + Math.sin(a) * l); x.stroke(); x.restore(); }
  x.save(); x.globalAlpha = .18; x.globalCompositeOperation = 'overlay'; for (let i = 0; i < 4; i++) for (let j = 0; j < 3; j++) x.drawImage(GRAIN, i * 512, j * 512); x.restore();
  for (let i = 0; i < 1600; i++) { x.fillStyle = `rgba(255,255,245,${rr(.35, .95)})`; x.beginPath(); x.arc(rnd() * BW, rnd() * BH, Math.pow(rnd(), 3) * 3.4 + .6, 0, TAU); x.fill(); }
  [[120, 160, 34], [1840, 120, 26], [1880, 700, 22], [90, 820, 28], [620, 60, 18]].forEach(([a, b, r]) => paperStar(x, a, b, r, rnd()));
  paint(x, S(E(1730, 930, 50, 50, 40), 1), '#e0763e', { lw: 4 });
  x.save(); x.lineWidth = 9; x.strokeStyle = '#f2c46a'; x.beginPath(); x.ellipse(1730, 930, 92, 22, -.35, 0, TAU); x.stroke(); x.restore();
}

  const base = [[0, floorY - 50]]; for (let i = 1; i <= 40; i++) base.push([i * 50, floorY - 50 + rr(-5, 5)]); base.push([BW, floorY + 5], [0, floorY + 5]);

  paint(x, S(R(-20, floorY, BW + 40, BH - floorY + 20, 0), 0), '#b88a5a', { lw: 0, line: false, hatch: 0, blooms: 18 });
  for (let i = 0; i < 2500; i++) { x.fillStyle = `rgba(${rnd() < .5 ? '90,60,30' : '230,200,160'},${rr(.2, .5)})`; x.fillRect(rnd() * BW, floorY + rnd() * (BH - floorY), rr(2, 5), rr(2, 4)); }

function bgLab(x) {

  for (let j = 0; j < 900; j += 56) pencil(x, [[0, j], [BW, j + rr(-3, 3)]], 1.5, '#6a9ac4', .35);

  for (let j = 0; j < 8; j++) pencil(x, [[0, 915 + j * 24 + rr(-4, 4)], [BW, 915 + j * 24 + rr(-4, 4)]], 2, '#7a4a25', .35);

function bg(draw) { const c = mk(BW, BH), x = c.getContext('2d'); SEED = 11; draw(x);
  const v = x.createRadialGradient(BW / 2, BH / 2, BH * .5, BW / 2, BH / 2, BH * 1.1); v.addColorStop(0, 'rgba(40,20,0,0)'); v.addColorStop(1, 'rgba(40,20,0,.18)'); x.fillStyle = v; x.fillRect(0, 0, BW, BH); return c; }

const ART = {
  c00: () => sticker(x => kid(x, false)), c01: () => sticker(x => kid(x, true)),
  c02: () => sticker(caveman, 1000, 1000), c03: () => sticker(pharaoh, 1000, 1000), c04: () => sticker(knight, 1000, 1000), c05: () => sticker(gent, 1000, 1000),
  c07: () => sticker(scientist), c08: () => sticker(brain, 1000, 900), c09: () => sticker(moon, 1000, 1000), c10: () => sticker(dog, 1100, 1100),

window.art = n => { const c = ART[n](); return c.toDataURL(n[0] === 'b' ? 'image/jpeg' : 'image/png', .92); };
