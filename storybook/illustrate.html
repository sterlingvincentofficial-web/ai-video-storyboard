<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<script>
// Hand-coded watercolour / paper cut-out illustrations for the storybook video.
// Every character and background is drawn procedurally here: no image models.
// window.art(name) -> PNG/JPEG data URL.

// ---------- utilities ----------
let SEED = 1;
function rnd() { SEED = (SEED * 16807) % 2147483647; return (SEED - 1) / 2147483646; }
function rr(a, b) { return a + rnd() * (b - a); }
function hex(c) { c = c.replace('#', ''); return [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16)); }
function shade(c, k) {           // k<0 darker, k>0 lighter
  const [r, g, b] = hex(c), f = v => Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k);
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
function rgba(c, a) { const [r, g, b] = hex(c); return `rgba(${r},${g},${b},${a})`; }
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

const GRAIN = (() => { const c = mk(512, 512), x = c.getContext('2d'), d = x.createImageData(512, 512);
  for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (Math.random() - .5) * 120; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0); return c; })();

// watercolour wash inside a path: base + pigment blooms + darker drying edge + grain
function wash(x, path, color, [bx, by, bw, bh], { edge = .32, blots = 22, var_ = .14 } = {}) {
  x.save(); x.clip(path);
  x.fillStyle = color; x.fillRect(bx - 20, by - 20, bw + 40, bh + 40);
  for (let i = 0; i < blots; i++) {
    const cx = bx + rnd() * bw, cy = by + rnd() * bh, r = Math.max(bw, bh) * rr(.12, .45);
    const g = x.createRadialGradient(cx, cy, 0, cx, cy, r), tone = rnd() < .5 ? shade(color, -var_) : shade(color, var_ * 1.4);
    g.addColorStop(0, rgbaOf(tone, .35));
    g.addColorStop(1, rgbaOf(tone, 0)); x.fillStyle = g; x.fillRect(bx - 20, by - 20, bw + 40, bh + 40);
  }
  x.filter = 'blur(7px)'; x.lineWidth = Math.max(10, Math.min(bw, bh) * .06); x.strokeStyle = rgbaOf(shade(color, -.35), edge); x.stroke(path); x.filter = 'none';
  x.globalAlpha = .13; x.globalCompositeOperation = 'multiply'; x.drawImage(GRAIN, bx, by, Math.max(bw, 512), Math.max(bh, 512));
  x.restore();
}
function rgbaOf(rgb, a) { return rgb.replace('rgb(', 'rgba(').replace(')', `,${a})`); }
// coloured-pencil outline: two slightly offset passes
function ink(x, path, w = 5, col = '#3b2a22') {
  x.save(); x.lineJoin = x.lineCap = 'round';
  x.strokeStyle = rgba(col, .85); x.lineWidth = w; x.stroke(path);
  x.translate(1.5, 1); x.strokeStyle = rgba(col, .3); x.lineWidth = w * .6; x.stroke(path); x.restore();
}
function paint(x, path, color, box, w = 5, opt) { wash(x, path, color, box, opt); ink(x, path, w); }
function P() { return new Path2D(); }
function ell(cx, cy, rx, ry, rot = 0) { const p = P(); p.ellipse(cx, cy, rx, ry, rot, 0, Math.PI * 2); return p; }
function rrect(x0, y0, w, h, r) { const p = P(); p.roundRect(x0, y0, w, h, r); return p; }
function poly(pts, close = true) { const p = P(); pts.forEach(([a, b], i) => i ? p.lineTo(a, b) : p.moveTo(a, b)); if (close) p.closePath(); return p; }
function blob(cx, cy, r, n = 9, j = .12) {  // wobbly round shape
  const p = P(), pts = [];
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, k = 1 + (rnd() - .5) * j * 2; pts.push([cx + Math.cos(a) * r * k, cy + Math.sin(a) * r * k]); }
  pts.forEach((q, i) => { const n2 = pts[(i + 1) % n], mx = (q[0] + n2[0]) / 2, my = (q[1] + n2[1]) / 2; i ? p.quadraticCurveTo(q[0], q[1], mx, my) : p.moveTo(mx, my); });
  const q = pts[0], n2 = pts[1]; p.quadraticCurveTo(q[0], q[1], (q[0] + n2[0]) / 2, (q[1] + n2[1]) / 2); p.closePath(); return p;
}
function pencil(x, pts, w = 4, col = '#3b2a22', a = .8) {
  x.save(); x.lineCap = x.lineJoin = 'round'; x.strokeStyle = rgba(col, a); x.lineWidth = w;
  x.beginPath(); pts.forEach(([p, q], i) => i ? x.lineTo(p, q) : x.moveTo(p, q)); x.stroke(); x.restore();
}
function blush(x, cx, cy, r, a = .5) { const g = x.createRadialGradient(cx, cy, 0, cx, cy, r); g.addColorStop(0, `rgba(232,110,110,${a})`); g.addColorStop(1, 'rgba(232,110,110,0)'); x.fillStyle = g; x.beginPath(); x.arc(cx, cy, r, 0, 7); x.fill(); }

// ---------- face ----------
function face(x, cx, cy, r, { skin = '#f5c6a5', yawn = 0, closed = false, look = [0, 0], mouth = 'smile', noHead = false, liner = false } = {}) {
  if (!noHead) paint(x, ell(cx, cy, r, r * 1.03), skin, [cx - r, cy - r, 2 * r, 2 * r], r * .035, { edge: .22 });
  blush(x, cx - r * .55, cy + r * .22, r * .24); blush(x, cx + r * .55, cy + r * .22, r * .24);
  const ey = cy - r * .02, ex = r * .36;
  for (const s of [-1, 1]) {
    const X = cx + s * ex;
    if (closed || yawn > .5) {
      pencil(x, [[X - r * .14, ey - r * .02], [X - r * .05, ey + r * .06], [X + r * .05, ey + r * .06], [X + r * .14, ey - r * .02]], r * .045);
      pencil(x, [[X - r * .13, ey - r * .2 - yawn * r * .06], [X + r * .13, ey - r * .22 - yawn * r * .08 + s * r * .02]], r * .035, '#5a3b2a', .7);
    } else {
      x.fillStyle = '#2c1f1a'; x.beginPath(); x.ellipse(X + look[0] * r * .08, ey + look[1] * r * .08, r * .075, r * .095, 0, 0, 7); x.fill();
      x.fillStyle = '#fff'; x.beginPath(); x.arc(X + look[0] * r * .08 + r * .025, ey + look[1] * r * .08 - r * .035, r * .025, 0, 7); x.fill();
      if (liner) { pencil(x, [[X - r * .16, ey - r * .04], [X + r * .2, ey - r * .06], [X + r * .3, ey - r * .1]], r * .04, '#111'); }
    }
  }
  pencil(x, [[cx - r * .04, cy + r * .2], [cx + r * .03, cy + r * .24], [cx - r * .02, cy + r * .27]], r * .03, '#8a5a44', .6);
  const my = cy + r * .5;
  if (yawn > 0) {
    const mw = r * .26, mh = r * .36 * yawn, mp = ell(cx, my + mh * .2, mw, mh);
    x.fillStyle = '#5a1f2c'; x.fill(mp);
    x.save(); x.clip(mp); x.fillStyle = '#e97a8a'; x.beginPath(); x.ellipse(cx, my + mh * .95, mw * .8, mh * .55, 0, 0, 7); x.fill();
    x.fillStyle = '#fbf6ee'; x.fillRect(cx - mw, my + mh * .2 - mh - 2, mw * 2, mh * .18); x.restore();
    ink(x, mp, r * .03);
  } else if (mouth === 'o') {
    const mp = ell(cx, my, r * .08, r * .1); x.fillStyle = '#5a1f2c'; x.fill(mp); ink(x, mp, r * .025);
  } else if (mouth === 'wavy') {
    pencil(x, [[cx - r * .15, my], [cx - r * .07, my - r * .04], [cx, my], [cx + r * .07, my - r * .04], [cx + r * .15, my]], r * .035);
  } else {
    x.save(); x.strokeStyle = 'rgba(59,42,34,.85)'; x.lineWidth = r * .04; x.lineCap = 'round'; x.beginPath(); x.arc(cx, my - r * .16, r * .17, .2 * Math.PI, .8 * Math.PI); x.stroke(); x.restore();
  }
}

// ---------- characters ----------
function kid(x, yawning) {
  const cx = 550;
  // backpack peeking behind
  paint(x, rrect(cx - 150, 560, 300, 250, 40), '#5f8f4e', [cx - 150, 560, 300, 250]);
  // arms (behind coat when up)
  if (yawning) {
    for (const s of [-1, 1]) {
      const p = poly([[cx + s * 95, 610], [cx + s * 150, 580], [cx + s * 175, 330], [cx + s * 135, 190], [cx + s * 95, 200], [cx + s * 120, 340], [cx + s * 90, 560]]);
      paint(x, p, '#e2a73c', [cx - 190, 180, 380, 440]);
      paint(x, ell(cx + s * 118, 175, 38, 40), '#f5c6a5', [cx + s * 118 - 40, 135, 80, 80], 4);
    }
  }
  // boots + legs
  for (const s of [-1, 1]) {
    paint(x, rrect(cx + s * 55 - 28, 880, 56, 90, 10), '#2b3150', [cx + s * 55 - 28, 880, 56, 90], 4);
    paint(x, rrect(cx + s * 60 - 48, 950, 100, 90, 26), '#2f8a84', [cx + s * 60 - 48, 950, 100, 90]);
  }
  // raincoat
  const coat = P(); coat.moveTo(cx - 120, 560); coat.quadraticCurveTo(cx, 530, cx + 120, 560); coat.lineTo(cx + 175, 900); coat.quadraticCurveTo(cx, 930, cx - 175, 900); coat.closePath();
  paint(x, coat, '#e2a73c', [cx - 175, 530, 350, 400], 5);
  pencil(x, [[cx, 575], [cx, 905]], 4, '#8a5a24', .7);
  for (let i = 0; i < 4; i++) { const b = ell(cx + 22, 620 + i * 70, 11, 11); x.fillStyle = '#7a4a1e'; x.fill(b); }
  pencil(x, [[cx - 120, 800], [cx - 60, 800]], 4, '#8a5a24', .6); pencil(x, [[cx + 70, 800], [cx + 128, 800]], 4, '#8a5a24', .6);
  // straps
  for (const s of [-1, 1]) paint(x, poly([[cx + s * 55, 555], [cx + s * 85, 555], [cx + s * 100, 700], [cx + s * 72, 700]]), '#4d7a40', [cx - 110, 550, 220, 160], 3);
  if (!yawning) {
    for (const s of [-1, 1]) {
      const p = poly([[cx + s * 110, 575], [cx + s * 150, 590], [cx + s * 205, 800], [cx + s * 165, 820], [cx + s * 115, 650]]);
      paint(x, p, '#e2a73c', [cx - 210, 570, 420, 260]);
      paint(x, ell(cx + s * 188, 835, 34, 36), '#f5c6a5', [cx + s * 188 - 36, 800, 72, 72], 4);
    }
  }
  // head + beanie
  face(x, cx, 420, 150, { yawn: yawning ? 1 : 0, look: [0, -1], mouth: 'smile' });
  const hat = P(); hat.moveTo(cx - 165, 400); hat.bezierCurveTo(cx - 170, 230, cx + 170, 230, cx + 165, 400); hat.closePath();
  paint(x, hat, '#d64a3c', [cx - 170, 240, 340, 170], 5);
  const band = rrect(cx - 172, 355, 344, 62, 26); paint(x, band, '#b83a30', [cx - 172, 355, 344, 62], 5);
  for (let i = -7; i <= 7; i++) pencil(x, [[cx + i * 22, 362], [cx + i * 22, 410]], 3, '#7a2019', .45);
  paint(x, blob(cx, 238, 46, 10, .12), '#e46a58', [cx - 50, 190, 100, 100], 4);
  for (let i = 0; i < 12; i++) pencil(x, [[cx - 30 + rnd() * 60, 210 + rnd() * 50], [cx - 30 + rnd() * 60, 210 + rnd() * 50]], 2, '#8a2a20', .35);
}
function bustBase(x, col, cx = 500) {
  const sh = P(); sh.moveTo(cx - 380, 1000); sh.quadraticCurveTo(cx - 360, 760, cx - 150, 730); sh.lineTo(cx + 150, 730); sh.quadraticCurveTo(cx + 360, 760, cx + 380, 1000); sh.closePath();
  paint(x, sh, col, [cx - 380, 730, 760, 270], 6);
  paint(x, rrect(cx - 70, 640, 140, 120, 30), '#f0bd98', [cx - 70, 640, 140, 120], 4);
}
function caveman(x) {
  const cx = 500;
  paint(x, blob(cx, 470, 290, 13, .16), '#6b4226', [cx - 300, 170, 600, 600], 6);   // hair mass
  const tunic = P(); tunic.moveTo(cx - 380, 1000); tunic.lineTo(cx - 340, 790);
  for (let i = 0; i <= 12; i++) tunic.lineTo(cx - 340 + i * 57, i % 2 ? 745 : 780); tunic.lineTo(cx + 380, 1000); tunic.closePath();
  paint(x, rrect(cx - 70, 640, 140, 140, 30), '#e8b590', [cx - 70, 640, 140, 140], 4);
  paint(x, tunic, '#a0703f', [cx - 380, 740, 760, 260], 6);
  for (let i = 0; i < 30; i++) { const px = cx - 320 + rnd() * 640, py = 790 + rnd() * 190; pencil(x, [[px, py], [px + 14, py + 22]], 4, '#6b4523', .5); }
  face(x, cx, 500, 210, { skin: '#e8b590', yawn: 1 });
  const beard = P(); beard.moveTo(cx - 200, 520); beard.quadraticCurveTo(cx - 190, 730, cx, 760); beard.quadraticCurveTo(cx + 190, 730, cx + 200, 520);
  beard.quadraticCurveTo(cx + 120, 650, cx + 70, 610); beard.quadraticCurveTo(cx, 690, cx - 70, 610); beard.quadraticCurveTo(cx - 120, 650, cx - 200, 520);
  paint(x, beard, '#7a4b2a', [cx - 200, 520, 400, 240], 5);
  face(x, cx, 500, 210, { skin: '#e8b590', yawn: 1, noHead: true });
  const fr = P(); for (let i = 0; i < 9; i++) { const a = Math.PI * (1.08 + i * .1); fr.moveTo(cx + Math.cos(a) * 205, 470 + Math.sin(a) * 215); fr.lineTo(cx + Math.cos(a + .05) * 150, 420 + Math.sin(a + .05) * 130); }
  ink(x, fr, 7, '#4a2c16');
  const bone = P(); bone.moveTo(cx + 60, 250); bone.lineTo(cx + 250, 190);
  x.save(); x.lineCap = 'round'; x.lineWidth = 34; x.strokeStyle = '#f4ecd8'; x.stroke(bone); x.restore(); ink(x, bone, 3);
  for (const [bx, by] of [[cx + 55, 250], [cx + 255, 188]]) for (const d of [-16, 16]) paint(x, ell(bx, by + d, 22, 20), '#f4ecd8', [bx - 22, by + d - 20, 44, 40], 3);
}
function pharaoh(x) {
  const cx = 500;
  const nemes = P(); nemes.moveTo(cx - 230, 330); nemes.quadraticCurveTo(cx, 170, cx + 230, 330); nemes.lineTo(cx + 330, 820); nemes.lineTo(cx - 330, 820); nemes.closePath();
  x.save(); wash(x, nemes, '#e5b742', [cx - 330, 170, 660, 650]); x.clip(nemes);
  for (let y = 180; y < 830; y += 56) { const s = rrect(cx - 340, y, 680, 28, 2); wash(x, s, '#27488f', [cx - 340, y, 680, 28], { blots: 4 }); }
  x.restore(); ink(x, nemes, 6);
  bustBase(x, '#f1e6c8');
  const collar = P(); collar.ellipse(cx, 760, 300, 150, 0, 0, Math.PI); collar.lineTo(cx - 300, 760); collar.closePath();
  x.save(); wash(x, collar, '#2a7f7a', [cx - 300, 760, 600, 150]); x.clip(collar);
  [['#e5b742', 50], ['#d64a3c', 90], ['#27488f', 125]].forEach(([c, rad]) => { x.strokeStyle = c; x.lineWidth = 18; x.beginPath(); x.ellipse(cx, 760, 300 - rad * .4, rad, 0, 0, Math.PI); x.stroke(); });
  x.restore(); ink(x, collar, 5);
  face(x, cx, 480, 190, { skin: '#d9a075', yawn: 1, liner: true });
  for (const s of [-1, 1]) pencil(x, [[cx + s * 70, 470], [cx + s * 150, 462], [cx + s * 205, 440]], 9, '#111', .9);
  const band = rrect(cx - 205, 300, 410, 46, 12); paint(x, band, '#e5b742', [cx - 205, 300, 410, 46], 4);
  const ur = poly([[cx - 20, 305], [cx, 245], [cx + 20, 305]]); paint(x, ur, '#e5b742', [cx - 20, 245, 40, 60], 3);
}
function knight(x) {
  const cx = 500;
  const plume = P(); plume.moveTo(cx + 10, 210); plume.bezierCurveTo(cx + 150, 60, cx + 340, 120, cx + 330, 330); plume.bezierCurveTo(cx + 250, 200, cx + 150, 200, cx + 40, 260); plume.closePath();
  paint(x, plume, '#d64a3c', [cx, 60, 340, 280], 5);
  for (let i = 0; i < 7; i++) pencil(x, [[cx + 60 + i * 30, 200 - i * 8], [cx + 110 + i * 30, 170 + i * 12]], 3, '#8a2019', .5);
  bustBase(x, '#a9b1b8');
  for (const s of [-1, 1]) paint(x, ell(cx + s * 260, 800, 170, 95, s * .15), '#bfc6cc', [cx + s * 260 - 170, 705, 340, 190], 6);
  const helm = P(); helm.moveTo(cx - 250, 760); helm.lineTo(cx - 250, 430); helm.bezierCurveTo(cx - 250, 170, cx + 250, 170, cx + 250, 430); helm.lineTo(cx + 250, 760); helm.closePath();
  paint(x, helm, '#b7bec4', [cx - 250, 200, 500, 560], 6);
  face(x, cx, 505, 175, { skin: '#f0c19e', yawn: 1 });
  const visor = P(); visor.moveTo(cx - 245, 330); visor.bezierCurveTo(cx - 200, 190, cx + 200, 190, cx + 245, 330); visor.lineTo(cx + 230, 370); visor.bezierCurveTo(cx + 150, 280, cx - 150, 280, cx - 230, 370); visor.closePath();
  paint(x, visor, '#9aa3aa', [cx - 245, 200, 490, 170], 5);
  for (let i = -3; i <= 3; i++) pencil(x, [[cx + i * 45 - 14, 300 - Math.abs(i) * 4], [cx + i * 45 + 14, 300 - Math.abs(i) * 4]], 6, '#3b3f44', .8);
  for (const [px, py] of [[cx - 225, 450], [cx + 225, 450], [cx - 225, 650], [cx + 225, 650]]) { x.fillStyle = '#6b7178'; x.beginPath(); x.arc(px, py, 8, 0, 7); x.fill(); }
}
function gent(x) {
  const cx = 500;
  bustBase(x, '#2c3a57');
  const shirt = poly([[cx - 90, 735], [cx + 90, 735], [cx, 900]]); paint(x, shirt, '#fbf7ee', [cx - 90, 735, 180, 165], 4);
  for (const s of [-1, 1]) paint(x, poly([[cx, 760], [cx + s * 75, 735], [cx + s * 60, 800]]), '#fbf7ee', [cx - 80, 730, 160, 80], 4);
  const bow = P(); bow.moveTo(cx, 770); bow.lineTo(cx - 70, 740); bow.lineTo(cx - 70, 800); bow.closePath(); bow.moveTo(cx, 770); bow.lineTo(cx + 70, 740); bow.lineTo(cx + 70, 800); bow.closePath();
  paint(x, bow, '#c8413a', [cx - 70, 740, 140, 60], 4);
  face(x, cx, 500, 195, { skin: '#f2c7a6', yawn: 1 });
  for (const s of [-1, 1]) { const m = P(); m.moveTo(cx, 575); m.bezierCurveTo(cx + s * 60, 545, cx + s * 130, 560, cx + s * 125, 600); m.bezierCurveTo(cx + s * 120, 625, cx + s * 90, 615, cx + s * 100, 595); ink(x, m, 16, '#5a3a22'); }
  const mono = ell(cx + 70, 498, 58, 58); x.save(); x.lineWidth = 9; x.strokeStyle = '#d4a53a'; x.stroke(mono); x.restore(); pencil(x, [[cx + 125, 520], [cx + 170, 640], [cx + 150, 740]], 3, '#b58a2a', .8);
  const brim = ell(cx, 330, 250, 40); const hat = rrect(cx - 160, 90, 320, 250, 18);
  paint(x, hat, '#1f6f6a', [cx - 160, 90, 320, 250], 6); paint(x, rrect(cx - 160, 270, 320, 45, 6), '#5a2a2a', [cx - 160, 270, 320, 45], 4);
  paint(x, brim, '#1a5c58', [cx - 250, 290, 500, 80], 6);
}
function scientist(x) {
  const cx = 520;
  for (const s of [-1, 1]) paint(x, rrect(cx + s * 60 - 32, 900, 64, 110, 14), '#5a5f6a', [cx + s * 60 - 32, 900, 64, 110], 4);
  for (const s of [-1, 1]) paint(x, ell(cx + s * 68, 1020, 60, 26), '#6b3f25', [cx + s * 68 - 60, 994, 120, 52], 4);
  const coat = P(); coat.moveTo(cx - 130, 470); coat.quadraticCurveTo(cx, 440, cx + 130, 470); coat.lineTo(cx + 190, 940); coat.lineTo(cx - 190, 940); coat.closePath();
  paint(x, coat, '#f1eee6', [cx - 190, 440, 380, 500], 5, { edge: .4 });
  pencil(x, [[cx, 480], [cx - 10, 940]], 4, '#8b8a82', .7); pencil(x, [[cx - 60, 470], [cx, 600], [cx + 60, 470]], 4, '#8b8a82', .8);
  paint(x, rrect(cx - 130, 720, 90, 70, 8), '#e9e5da', [cx - 130, 720, 90, 70], 3);
  // tank arm (right) holding green tank
  const tank = rrect(cx + 200, 560, 120, 330, 55); paint(x, tank, '#4f9a5d', [cx + 200, 560, 120, 330], 5);
  paint(x, rrect(cx + 238, 520, 44, 50, 8), '#9aa3aa', [cx + 238, 520, 44, 50], 4);
  pencil(x, [[cx + 260, 525], [cx + 300, 470], [cx + 230, 430], [cx + 150, 470]], 7, '#6b7178', .9);
  paint(x, ell(cx + 140, 480, 40, 30), '#dbeef2', [cx + 100, 450, 80, 60], 4);
  paint(x, poly([[cx + 120, 490], [cx + 175, 520], [cx + 225, 700], [cx + 190, 720], [cx + 130, 580]]), '#f1eee6', [cx + 110, 480, 120, 240]);
  paint(x, ell(cx + 215, 715, 32, 34), '#f2c7a6', [cx + 183, 680, 64, 70], 4);
  // scratching arm (left)
  paint(x, poly([[cx - 120, 490], [cx - 170, 510], [cx - 230, 380], [cx - 190, 300], [cx - 150, 320], [cx - 185, 390]]), '#f1eee6', [cx - 235, 295, 120, 220]);
  paint(x, ell(cx - 170, 290, 34, 36), '#f2c7a6', [cx - 204, 254, 68, 72], 4);
  // hair cloud behind head
  for (let i = 0; i < 9; i++) { const a = Math.PI * (.85 + i * .16); paint(x, blob(cx + Math.cos(a) * 130, 310 + Math.sin(a) * 120, 62, 8, .15), '#e7e6e2', [cx - 220, 150, 440, 320], 4); }
  face(x, cx, 330, 125, { skin: '#f2c7a6', mouth: 'wavy', look: [-.5, -.8] });
  for (const s of [-1, 1]) { const g = ell(cx + s * 45, 328, 38, 38); x.save(); x.lineWidth = 7; x.strokeStyle = '#3b2a22'; x.stroke(g); x.fillStyle = 'rgba(210,235,245,.25)'; x.fill(g); x.restore(); }
  pencil(x, [[cx - 8, 326], [cx + 8, 326]], 6);
  for (const s of [-1, 1]) pencil(x, [[cx + s * 20, 272], [cx + s * 70, 262 - s * 10]], 5, '#8b8a82', .8);
}
function brainShape(cx, cy, k = 1) {

function sun(x) {

// ---------- sticker border + crop ----------
function sticker(draw, w = 1100, h = 1100, R = 16) {
  const a = mk(w, h), x = a.getContext('2d'); SEED = 7; draw(x);

  for (let i = 0; i < 28; i++) { const t = i / 28 * Math.PI * 2; y.drawImage(a, pad + Math.cos(t) * R, pad + Math.sin(t) * R); }
  y.globalCompositeOperation = 'source-in'; y.fillStyle = '#fbf8f1'; y.fillRect(0, 0, b.width, b.height);
  y.globalCompositeOperation = 'source-atop'; y.globalAlpha = .08; y.drawImage(GRAIN, 0, 0, b.width, b.height);
  y.globalAlpha = 1; y.globalCompositeOperation = 'source-over'; y.drawImage(a, pad, pad);
  const d = y.getImageData(0, 0, b.width, b.height).data; let x0 = b.width, y0 = b.height, x1 = 0, y1 = 0;
  for (let j = 0; j < b.height; j++) for (let i = 0; i < b.width; i++) if (d[(j * b.width + i) * 4 + 3] > 20) { if (i < x0) x0 = i; if (i > x1) x1 = i; if (j < y0) y0 = j; if (j > y1) y1 = j; }
  const c = mk(x1 - x0 + 1, y1 - y0 + 1); c.getContext('2d').drawImage(b, -x0, -y0); return c;
}

// ---------- backgrounds (1960x1104) ----------
const BW = 1960, BH = 1104;
function paperBase(x, col, bl = 40, v = .06) {

}

  const p = P(); for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5 - Math.PI / 2 + rot, q = i % 2 ? r * .45 : r; i ? p.lineTo(cx + Math.cos(a) * q, cy + Math.sin(a) * q) : p.moveTo(cx + Math.cos(a) * q, cy + Math.sin(a) * q); } p.closePath();

function bg(draw) { const c = mk(BW, BH), x = c.getContext('2d'); SEED = 11; draw(x);
  const v = x.createRadialGradient(BW / 2, BH / 2, BH * .5, BW / 2, BH / 2, BH * 1.1); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(40,20,0,.18)'); x.fillStyle = v; x.fillRect(0, 0, BW, BH); return c; }

const ART = {
  c00: () => sticker(x => kid(x, false)), c01: () => sticker(x => kid(x, true)),
  c02: () => sticker(caveman, 1000, 1000), c03: () => sticker(pharaoh, 1000, 1000), c04: () => sticker(knight, 1000, 1000), c05: () => sticker(gent, 1000, 1000),
