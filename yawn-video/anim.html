<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:P;font-weight:500;src:url(p500.woff2)}
@font-face{font-family:P;font-weight:700;src:url(p700.woff2)}
@font-face{font-family:P;font-weight:800;src:url(p800.woff2)}
html,body{margin:0;background:#000}
canvas{display:block}
</style></head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W=1920,H=1080,DUR=60;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const C={bg1:'#0E1230',bg2:'#1B1F4B',ink:'#F5F3FF',dim:'#9AA0D6',coral:'#FF6B6B',yellow:'#FFD166',teal:'#2EE6B6',blue:'#4CC9F0',pink:'#F72585',purple:'#9B5DE5',skin:'#FFC8A2',skinD:'#E8A47E'};

// ---------- helpers ----------
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const P=(t,a,b)=>clamp((t-a)/(b-a));
const eo=t=>1-Math.pow(1-t,3);
const eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eb=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const el=t=>t===0?0:t===1?1:Math.pow(2,-10*t)*Math.sin((t*10-.75)*(2*Math.PI)/3)+1;
function rand(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}

function txt(s,x,y,size,col=C.ink,{a=1,align='center',w=800,base='middle',sp=0}={}){
  if(a<=0)return;ctx.save();ctx.globalAlpha*=a;ctx.font=`${w} ${size}px P`;ctx.fillStyle=col;
  ctx.textAlign=align;ctx.textBaseline=base;if(sp)ctx.letterSpacing=sp+'px';ctx.fillText(s,x,y);ctx.restore();
}
// text that rises in word by word
function rise(s,x,y,size,t,col=C.ink,{w=800,align='center',stagger=.08,a=1}={}){
  ctx.save();ctx.font=`${w} ${size}px P`;
  const words=s.split(' ');const widths=words.map(q=>ctx.measureText(q+' ').width);
  const total=widths.reduce((p,q)=>p+q,0)-ctx.measureText(' ').width;
  let cx=align==='center'?x-total/2:align==='right'?x-total:x;
  words.forEach((q,i)=>{const p=eo(clamp((t-i*stagger)/.5));
    if(p>0){ctx.globalAlpha=p*a;ctx.fillStyle=col;ctx.textBaseline='middle';ctx.textAlign='left';
      ctx.fillText(q,cx,y+(1-p)*size*.6);}
    cx+=widths[i];});
  ctx.restore();
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function circle(x,y,r,col,a=1){ctx.save();ctx.globalAlpha*=a;ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,7);ctx.fillStyle=col;ctx.fill();ctx.restore()}
function pill(x,y,w,h,col,a=1){ctx.save();ctx.globalAlpha*=a;rr(x-w/2,y-h/2,w,h,h/2);ctx.fillStyle=col;ctx.fill();ctx.restore()}

// yawn curve: p in 0..1 -> openness 0..1  (slow inhale, hold, fast exhale)
function yawnCurve(p){if(p<=0||p>=1)return 0;if(p<.55)return eio(p/.55);if(p<.72)return 1;return 1-eio((p-.72)/.28)}

// ---------- the character ----------
function face(x,y,r,open,{col=C.skin,blink=0,look=0,tint=null,a=1}={}){
  ctx.save();ctx.globalAlpha*=a;ctx.translate(x,y);
  const s=r/100;ctx.scale(s,s);
  const o=clamp(open);
  // stretch head a bit when yawning
  ctx.scale(1-o*.04,1+o*.08);ctx.translate(0,-o*6);
  // shadow
  ctx.beginPath();ctx.ellipse(0,112,70,10,0,0,7);ctx.fillStyle='rgba(0,0,0,.25)';ctx.fill();
  // head
  ctx.beginPath();ctx.arc(0,0,100,0,7);ctx.fillStyle=col;ctx.fill();
  if(tint){ctx.globalAlpha*=tint[1];ctx.fillStyle=tint[0];ctx.fill();ctx.globalAlpha/=tint[1]}
  // cheeks
  ctx.globalAlpha*=.35;circle(-58,28,16,C.coral);circle(58,28,16,C.coral);ctx.globalAlpha/=.35;
  // eyes
  const eyeClose=Math.max(clamp((o-.35)/.4),blink);
  ctx.strokeStyle='#2A1F3D';ctx.fillStyle='#2A1F3D';ctx.lineWidth=7;ctx.lineCap='round';
  for(const sx of[-1,1]){
    const ex=sx*36+look*8,ey=-14-o*6;
    if(eyeClose>.85){ctx.beginPath();ctx.arc(ex,ey-2,14,.15*Math.PI,.85*Math.PI);ctx.stroke();}
    else{ctx.beginPath();ctx.ellipse(ex,ey,11,14*(1-eyeClose),0,0,7);ctx.fill();
      circle(ex+3,ey-5*(1-eyeClose),4*(1-eyeClose),'#fff');}
    // brows
    ctx.beginPath();ctx.moveTo(ex-16,ey-30-o*14);ctx.quadraticCurveTo(ex,ey-38-o*18+sx*o*3,ex+16,ey-30-o*12);ctx.stroke();
  }
  // mouth
  const mw=18+o*30,mh=4+o*58,my=42+o*8;
  if(o<.05){ctx.beginPath();ctx.arc(0,34,18,.15*Math.PI,.85*Math.PI);ctx.stroke();}
  else{ctx.beginPath();ctx.ellipse(0,my,mw,mh,0,0,7);ctx.fillStyle='#3B1530';ctx.fill();
    ctx.save();ctx.clip();circle(0,my+mh*.75,mw*.8,'#FF7A9A');ctx.fillStyle='#fff';ctx.fillRect(-mw*.6,my-mh-2,mw*1.2,8*o);ctx.restore();
  }
  ctx.restore();
}

// ---------- background ----------
const stars=[...Array(90)].map((_,i)=>({x:rand(i)*W,y:rand(i+99)*H,r:rand(i+7)*2+.5,s:rand(i+3)*.5+.2}));
function bg(t,hue=0){
  const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,C.bg1);g.addColorStop(1,C.bg2);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // drifting blobs
  ctx.save();ctx.globalAlpha=.16;
  const bl=[[C.purple,.2,.3],[C.blue,.8,.7],[C.pink,.6,.15]];
  bl.forEach(([c,bx,by],i)=>{const x=bx*W+Math.sin(t*.2+i*2)*120,y=by*H+Math.cos(t*.17+i)*90;
    const rg=ctx.createRadialGradient(x,y,0,x,y,520);rg.addColorStop(0,c);rg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=rg;ctx.fillRect(0,0,W,H)});
  ctx.restore();
  stars.forEach((s,i)=>circle(s.x,(s.y-t*s.s*8+H)%H,s.r,'#fff',.25+.25*Math.sin(t*2+i)));
}

// small label chip
function chip(s,x,y,col,t,{size=34,a=1}={}){
  const p=eb(clamp(t/.5));if(p<=0)return;
  ctx.save();ctx.font=`700 ${size}px P`;const w=ctx.measureText(s).width+size*1.4;
  ctx.translate(x,y);ctx.scale(p,p);ctx.globalAlpha*=clamp(t/.3)*a;
  rr(-w/2,-size*.95,w,size*1.9,size*.95);ctx.fillStyle=col;ctx.fill();
  ctx.fillStyle='#14163A';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(s,0,4);ctx.restore();
}
function kicker(s,t,col=C.yellow){ // section label top-left
  const p=eo(clamp(t/.6));
  ctx.save();ctx.globalAlpha=p;pill(140+(1-p)*-60,110,12,12,col);ctx.restore();
  txt(s,165+(1-p)*-60,112,30,col,{a:p,align:'left',w:700,sp:4});
}

// ---------- brain ----------
function brain(x,y,s,col,{glow=0}={}){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  if(glow>0){ctx.shadowColor=col;ctx.shadowBlur=60*glow}
  ctx.beginPath();
  const lobes=[[-60,-30,60],[0,-55,62],[60,-30,58],[-70,25,50],[70,25,50],[0,15,70]];
  lobes.forEach(([lx,ly,lr])=>{ctx.moveTo(lx+lr,ly);ctx.arc(lx,ly,lr,0,7)});
  ctx.fillStyle=col;ctx.fill();ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(0,0,0,.22)';ctx.lineWidth=7;ctx.lineCap='round';
  const sq=[[[-95,-20],[-60,-50],[-30,-10]],[[-10,-90],[10,-50],[-15,-20]],[[40,-70],[70,-40],[100,-60]],[[30,0],[70,10],[105,40]],[[-100,40],[-60,20],[-30,50]],[[-10,40],[20,20],[40,60]],[[0,-100],[0,70],[0,70]]];
  sq.forEach(([a,b,c])=>{ctx.beginPath();ctx.moveTo(...a);ctx.quadraticCurveTo(...b,...c);ctx.stroke()});
  ctx.restore();
}

// ---------- scenes ----------
const scenes=[];
function S(start,end,fn){scenes.push({start,end,fn})}

// 0: Title
S(0,9,(t)=>{
  const y1=yawnCurve(P(t,.8,4.8)),y2=yawnCurve(P(t,5.4,8.6))*.8;
  const fp=eb(clamp(t/.8));
  face(560,560,190*fp,Math.max(y1,y2),{blink:t<.6?1:0});
  // Z's
  for(let i=0;i<3;i++){const zt=(t*0.7+i*.33)%1;txt('z',720+zt*120+i*10,380-zt*200,30+zt*40,C.blue,{a:Math.sin(zt*Math.PI)*.8});}
  rise('WHY DO WE',1300,420,110,t-.6,C.ink,{stagger:.12});
  const p=el(clamp((t-1.2)/1.2));
  ctx.save();ctx.translate(1300,570);ctx.scale(p,p);txt('YAWN?',0,0,210,C.yellow,{w:800});ctx.restore();
  rise('the science of the world\'s most contagious reflex',1300,720,34,t-2.4,C.dim,{w:500,stagger:.05});
});

// 1: Everyone yawns
S(9,20,(t)=>{
  kicker('EVERYONE DOES IT',t);
  const a1=1-P(t,5.2,5.8);
  // counter part
  if(a1>0){ctx.save();ctx.globalAlpha=a1;
    const faces=[[420,560],[700,560],[980,560],[1260,560],[1540,560]];
    faces.forEach(([x,y],i)=>{const st=.3+i*.18;const p=eb(clamp((t-st)/.5));
      face(x,y-60,95*p,yawnCurve(P(t,1.6+i*.35,4+i*.35)),{col:[C.skin,'#D9A07B','#8D5B3E','#F1C27D','#C68642'][i]})});
    const n=Math.round(lerp(0,10,eo(P(t,1.2,3.6))));
    rise('The average person yawns',960,760,50,t-.8,C.ink,{w:700});
    txt(`5 – ${Math.max(5,n)} times a day`,960,850,78,C.yellow,{a:P(t,1.2,1.7)});
    ctx.restore();}
  // womb part
  const t2=t-5.6;
  if(t2>0){const p=eb(clamp(t2/.8));
    ctx.save();ctx.translate(700,570);ctx.scale(p,p);
    const rg=ctx.createRadialGradient(0,0,20,0,0,300);rg.addColorStop(0,'#FF8FAB');rg.addColorStop(1,'#B5179E');
    ctx.beginPath();ctx.arc(0,0,280,0,7);ctx.fillStyle=rg;ctx.fill();
    circle(0,0,250,'#FFB3C6',.35);
    // fetus: head + curled body
    ctx.beginPath();ctx.ellipse(40,60,110,130,.5,0,7);ctx.fillStyle='#FFD6C2';ctx.fill();
    // cord
    ctx.strokeStyle='#E07A9A';ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(10,90);ctx.bezierCurveTo(-120,160,-180,40,-240,-60);ctx.stroke();
    ctx.restore();
    face(700-60*p,570-120*p,95*p,yawnCurve(P(t2,1.2,4.4)),{col:'#FFD6C2'});
    rise('It starts before you\'re even born',1350,470,52,t2-.4,C.ink,{w:700,stagger:.07});
    txt('~11 weeks',1350,590,120,C.yellow,{a:P(t2,1,1.5)});
    rise('Babies yawn in the womb',1350,700,40,t2-1.5,C.dim,{w:500});}
});

// 2: Anatomy of a yawn
S(20,32,(t)=>{
  kicker('ANATOMY OF A YAWN',t,C.teal);
  const cyc=P(t,1.2,8.2); // one long yawn ~7s
  const o=yawnCurve(cyc);
  face(520,560,230,o);
  // ribcage/air indicator: arrows into mouth during inhale
  if(cyc>0&&cyc<.55){for(let i=0;i<5;i++){const q=((t*1.4+i/5)%1);ctx.save();ctx.globalAlpha=Math.sin(q*Math.PI)*.8;
    ctx.strokeStyle=C.blue;ctx.lineWidth=6;ctx.lineCap='round';const x=520+lerp(-260,-20,q)*-1*(i%2?1:-1)*.0+lerp(900,560,q)-520,y=640+(i-2)*30*(1-q);
    ctx.beginPath();ctx.moveTo(x+40,y);ctx.lineTo(x,y);ctx.stroke();ctx.restore();}}
  if(cyc>.72&&cyc<1){for(let i=0;i<5;i++){const q=((t*2+i/5)%1);ctx.save();ctx.globalAlpha=Math.sin(q*Math.PI)*.8;
    ctx.strokeStyle=C.coral;ctx.lineWidth=6;ctx.lineCap='round';const x=lerp(600,900,q),y=640+(i-2)*30*q;
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+40,y);ctx.stroke();ctx.restore();}}
  const steps=[['1','Long, deep inhale','Lungs fill, chest expands',C.blue,0,.55],
               ['2','Peak stretch','Jaw opens wide, muscles tense, heart rate jumps',C.yellow,.55,.72],
               ['3','Quick exhale','Everything relaxes — ahh',C.coral,.72,1]];
  steps.forEach(([n,h,sub,col,a,b],i)=>{
    const y=340+i*170,st=.4+i*.3;const p=eo(clamp((t-st)/.6));
    const active=cyc>=a&&cyc<b;const act=active?1:(cyc>=b?.55:.35);
    ctx.save();ctx.globalAlpha=p;ctx.translate((1-p)*80,0);
    circle(1040,y,44,col,act);txt(n,1040,y+3,44,'#14163A',{w:800});
    txt(h,1110,y-18,50,C.ink,{align:'left',w:700,a:.4+act*.6});
    txt(sub,1110,y+34,30,C.dim,{align:'left',w:500,a:.4+act*.6});
    ctx.restore();});
  // timer bar
  const bp=P(t,1.2,8.2);const bx=1040,by=880,bw=720;
  pill(bx+bw/2-22,by,bw,16,'rgba(255,255,255,.12)',P(t,.6,1));
  ctx.save();rr(bx-30,by-8,bw*bp,16,8);ctx.fillStyle=C.teal;ctx.fill();ctx.restore();
  txt(`${(bp*6).toFixed(1)} s`,bx+bw-20,by-40,34,C.teal,{align:'right',w:700,a:P(t,.6,1)});
  rise('A typical human yawn lasts about 6 seconds',960,990,36,t-8.6,C.ink,{w:500,stagger:.05});
});

// 3: Myth — oxygen
S(32,44,(t)=>{
  kicker('THEORY #1',t,C.blue);
  rise('"We yawn because we need more oxygen"',960,230,58,t-.3,C.ink,{w:700,stagger:.07});
  // lungs
  const br=1+Math.sin(t*2.2)*.05;
  ctx.save();ctx.translate(620,600);ctx.scale(br,br);
  ctx.strokeStyle='#E8E6FF';ctx.lineWidth=14;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(0,-220);ctx.lineTo(0,-90);ctx.moveTo(0,-90);ctx.lineTo(-50,-50);ctx.moveTo(0,-90);ctx.lineTo(50,-50);ctx.stroke();
  for(const sx of[-1,1]){ctx.beginPath();ctx.moveTo(sx*40,-120);ctx.bezierCurveTo(sx*200,-180,sx*220,120,sx*170,170);ctx.bezierCurveTo(sx*120,200,sx*50,160,sx*40,60);ctx.closePath();
    ctx.fillStyle='#FF8FAB';ctx.fill();}
  ctx.restore();
  // O2 bubbles
  for(let i=0;i<12;i++){const q=(t*.35+rand(i))%1;const x=620+(rand(i+40)-.5)*520,y=870-q*620;
    ctx.save();ctx.globalAlpha=Math.sin(q*Math.PI)*.9;circle(x,y,30,C.blue);txt('O₂',x,y+2,26,'#14163A',{w:800});ctx.restore();}
  // experiment card
  const cp=eo(P(t,2.2,3));
  ctx.save();ctx.globalAlpha=cp;ctx.translate((1-cp)*100,0);
  rr(1050,360,720,420,36);ctx.fillStyle='rgba(255,255,255,.07)';ctx.fill();
  txt('THE 1987 TEST',1110,420,30,C.yellow,{align:'left',w:700,sp:3});
  rise('People breathed air with extra oxygen',1110,500,36,t-2.8,C.ink,{w:500,align:'left',stagger:.05});
  rise('…or extra carbon dioxide.',1110,560,36,t-3.6,C.ink,{w:500,align:'left',stagger:.05});
  rise('Their yawning didn\'t change.',1110,660,46,t-4.8,C.coral,{w:800,align:'left',stagger:.08});
  ctx.restore();
  // BUSTED stamp
  const sp=P(t,6.6,7.1);if(sp>0){const k=lerp(2.2,1,eo(sp));ctx.save();ctx.translate(1410,860);ctx.rotate(-.12);ctx.scale(k,k);ctx.globalAlpha=sp;
    ctx.strokeStyle=C.coral;ctx.lineWidth=10;rr(-230,-62,460,124,18);ctx.stroke();txt('MYTH BUSTED',0,4,64,C.coral,{w:800,sp:3});ctx.restore();}
});

// 4: Brain cooling
S(44,62,(t)=>{
  kicker('THEORY #2 · THE LEADING IDEA',t,C.teal);
  const part2=P(t,10,10.6);
  if(part2<1){ctx.save();ctx.globalAlpha=1-part2;
    rise('Your yawn is a radiator for your brain',960,220,60,t-.3,C.ink,{w:800,stagger:.07});
    // heat rises 0-3.5, yawn 3.5-7.5, cools after
    const heat=eo(P(t,.8,3.5))*(1-eio(P(t,5,8)));
    const hc=`rgb(${lerp(76,255,heat)|0},${lerp(201,107,heat)|0},${lerp(240,107,heat)|0})`;
    brain(1300,560,1.35,hc,{glow:.6});
    // heat waves
    for(let i=0;i<3;i++){ctx.save();ctx.globalAlpha=heat*.8;ctx.strokeStyle=C.coral;ctx.lineWidth=6;ctx.beginPath();
      const x=1200+i*100,yy=340-((t*60+i*30)%60);ctx.moveTo(x,yy);ctx.bezierCurveTo(x-20,yy-30,x+20,yy-50,x,yy-80);ctx.stroke();ctx.restore();}
    // thermometer
    const tx=1680,ty=380;rr(tx-22,ty,44,300,22);ctx.fillStyle='rgba(255,255,255,.15)';ctx.fill();
    circle(tx,ty+310,40,hc);rr(tx-12,ty+300-240*(.3+heat*.7),24,240*(.3+heat*.7)+10,12);ctx.fillStyle=hc;ctx.fill();
    txt(heat>.5?'WARM':'COOL',tx,ty-40,30,hc,{w:800});
    const o=yawnCurve(P(t,3.5,7.8));
    face(520,580,200,o,{tint:[C.coral,heat*.25]});
    // cool air stream from mouth to brain
    if(o>.2){for(let i=0;i<14;i++){const q=(t*.9+i/14)%1;const x=lerp(560,1250,q),y=640-Math.sin(q*Math.PI)*220+(rand(i)-.5)*40;
      circle(x,y,8+rand(i+3)*8,C.blue,Math.sin(q*Math.PI)*o);}}
    rise('Cool air rushes in + the jaw stretch pumps fresh blood toward the skull',960,930,36,t-4.2,C.dim,{w:500,stagger:.04});
    ctx.restore();}
  // chart
  if(t>10){const t2=t-10.3;
    rise('We yawn the most in a temperature sweet spot',960,220,56,t2,C.ink,{w:800,stagger:.06});
    const ox=380,oy=860,cw=1160,ch=480;
    ctx.save();ctx.globalAlpha=P(t2,0,.5);ctx.strokeStyle='rgba(255,255,255,.4)';ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(ox,oy-ch);ctx.lineTo(ox,oy);ctx.lineTo(ox+cw,oy);ctx.stroke();ctx.restore();
    txt('AIR TEMPERATURE →',ox+cw,oy+50,26,C.dim,{align:'right',w:700,a:P(t2,.3,.8),sp:2});
    ctx.save();ctx.translate(ox-40,oy-ch/2);ctx.rotate(-Math.PI/2);txt('YAWNS →',0,0,26,C.dim,{w:700,a:P(t2,.3,.8),sp:2});ctx.restore();
    const dp=eio(P(t2,.8,3));
    const g=ctx.createLinearGradient(ox,0,ox+cw,0);g.addColorStop(0,C.blue);g.addColorStop(.5,C.teal);g.addColorStop(1,C.coral);
    ctx.save();ctx.strokeStyle=g;ctx.lineWidth=10;ctx.lineCap='round';ctx.beginPath();
    for(let i=0;i<=200*dp;i++){const u=i/200;const v=Math.exp(-Math.pow((u-.45)/.2,2));const x=ox+30+u*(cw-60),y=oy-30-v*(ch-80);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
    ctx.stroke();ctx.restore();
    chip('~20°C / 68°F',ox+30+.45*(cw-60),oy-ch-10,C.teal,t2-3);
    rise('Too cold: no need to cool',ox+40,oy-110,30,t2-3.6,C.blue,{w:700,align:'left'});
    rise('Too hot: the air can\'t cool you',ox+cw-40,oy-110,30,t2-4.2,C.coral,{w:700,align:'right'});
    rise('Parrots, rats and people all follow this pattern',960,960,34,t2-5,C.dim,{w:500,stagger:.05});
  }
});

// 5: Bigger brains, longer yawns
S(62,73,(t)=>{
  kicker('BIGGER BRAINS, LONGER YAWNS',t,C.pink);
  rise('Across 19 species, animals with bigger brains yawn longer',960,230,50,t-.3,C.ink,{w:700,stagger:.06});
  const rows=[['Mouse',.13,C.blue],['Rabbit',.22,C.teal],['Cat',.35,C.yellow],['Walrus',.5,C.purple],['Chimp',.72,C.pink],['Human',1,C.coral]];
  rows.forEach(([n,v,col],i)=>{const y=360+i*95;const p=eo(P(t,1+i*.35,2.4+i*.35));
    txt(n,560,y,40,C.ink,{align:'right',w:700,a:P(t,.8+i*.35,1.2+i*.35)});
    ctx.save();rr(600,y-28,1000*v*p,56,28);ctx.fillStyle=col;ctx.fill();ctx.restore();
    brain(600+1000*v*p+40,y,.18+v*.12,col,{});});
  txt('≈ 6.4 s',1695,360+5*95,40,C.coral,{align:'left',w:800,a:P(t,4.5,5)});
  rise('Longer yawn → more cooling for a bigger, hotter brain',960,960,36,t-6,C.dim,{w:500,stagger:.05});
});

// 6: State change
S(73,84,(t)=>{
  kicker('A RESET BUTTON',t,C.yellow);

// ---------- master render ----------
// 60s cut: [scene index, new duration]
const PLAN=[[0,5],[3,9.5],[4,15],[7,16],[8,8],[9,6.5]];
function render(T){
  ctx.clearRect(0,0,W,H);bg(T);
  let st=0;
  PLAN.forEach(([idx,nd],pi)=>{
    const s=scenes[idx],d=s.end-s.start,k=d/nd;
    if(T>=st-.001&&T<st+nd){
      const lt=(T-st)*k;
      const fin=pi===0?1:eo(clamp(lt/.45)),fout=pi===PLAN.length-1?1:1-eio(clamp((lt-(d-.45))/.45));
      ctx.save();ctx.globalAlpha=Math.min(fin,fout);
      const z=1+(1-fout)*.04;ctx.translate(W/2,H/2);ctx.scale(z,z);ctx.translate(-W/2,-H/2);
      s.fn(lt,d);ctx.restore();
    }
    st+=nd;
  });
  ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect(0,H-6,W,6);ctx.fillStyle=C.yellow;ctx.fillRect(0,H-6,W*T/DUR,6);
}
window.render=render;
